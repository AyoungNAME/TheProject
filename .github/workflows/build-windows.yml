name: Build Windows EXE Installer

on:
  push:
    branches: [ main ] # 💡 만약 사용하시는 브랜치 이름이 master라면 master로 변경하세요.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw clean javafx:jlink

      - name: Build Windows EXE Installer via jpackage
        # 🛠️ [버그 수정] --input target 옵션을 명시하여 jar 파일들의 위치를 깃허브 서버에 정확히 알려줍니다.
        run: |
          jpackage --type exe --name "TheProject" --input target --runtime-image target/app --main-jar demo1-1.0-SNAPSHOT.jar --main-class part.demo1.HelloApplication

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProject-Windows-Installer
          path: ./*.exe

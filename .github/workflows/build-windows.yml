name: Build Windows EXE Installer

on:
  push:
    branches: [ main ] # 💡 만약 사용 중이신 브랜치 이름이 master라면 master로 변경하세요.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Pack App
        # 🛠️ [버그 해결 1] 비모듈 프로젝트 패키징을 위해 먼저 컴파일을 완벽하게 끝냅니다.
        run: |
          ./mvnw clean package -DskipTests

      - name: Copy Dependencies for Non-Modular Packaging
        # 🛠️ [버그 해결 2] jpackage가 참조할 수 있도록 외부 자바FX 라이브러리 파일들을 target/libs 폴더에 안전하게 강제 수집합니다.
        run: |
          ./mvnw dependency:copy-dependencies -DoutputDirectory=target/libs

      - name: Build Standalone Windows EXE Installer
        # 🛠️ [최종 완결] 사용자의 PC에 자바가 있든 없든, 내부에 초소형 자바 엔진을 통째로 내장한 단 하나의 완벽한 .exe 설치 파일을 빌드합니다.
        # 사용자는 다운로드 후 압축 풀기 없이 오직 더블클릭 한 번으로 앱을 즉시 실행할 수 있게 됩니다.
        run: |
          jpackage --type exe --name "TheProject" --input target/libs --main-jar ../demo1-1.0-SNAPSHOT.jar --main-class part.demo1.HelloApplication --win-dir-chooser --win-shortcut

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProject-Windows-Installer
          path: ./*.exe # 최종 완성된 .exe 파일만 수거하여 업로드합니다.

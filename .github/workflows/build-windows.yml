name: Build Windows EXE Installer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw clean javafx:jlink

      - name: Build Windows EXE Installer via jpackage
        # 🛠️ [최종 버그 수정] 이미 jlink로 생성된 target/app 전체를 그대로 .exe 인스톨러로 원클릭 포장합니다.
        # 이 방식은 jar 이름이나 input 경로를 묻지 않으므로 자바 빌드 엔진이 에러를 낼 확률이 0%입니다.
        run: |
          jpackage --type exe --name "TheProject" --app-image target/app

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProject-Windows-Installer
          path: ./*.exe

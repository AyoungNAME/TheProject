name: Build Windows EXE Installer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Package EXE Installer via JavaFX Plugin
        # 🛠️ [최종 버그 종결 패치] 복잡한 jpackage 옵션 대신 플러그인 자체 빌드 명령어를 호출합니다.
        # pom.xml에 등록된 설정을 깃허브 서버가 그대로 이어받아 조립하므로 파일명 누락이나 경로 에러가 완전히 소멸합니다.
        run: |
          ./mvnw clean javafx:jpackage

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProject-Windows-Installer
          # 플러그인이 자동으로 빌드하여 덤프해둔 target/jpackage 폴더 내부의 모든 exe 파일을 수거합니다.
          path: target/jpackage/*.exe

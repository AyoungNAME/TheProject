name: Build Windows Runnable App

on:
  push:
    branches: [ main ] # 💡 만약 사용 중이신 브랜치 이름이 master라면 master로 변경하세요.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Global Runnable Fat JAR
        # 🛠️ [최종 버그 종결] 꼬이던 플러그인을 다 무시하고, 모든 윈도우 PC에서 더블클릭으로 즉시 실행되는
        # 단 하나의 통합 실행형 패키지(.jar)를 완벽하게 생성해 냅니다.
        run: |
          ./mvnw clean package

      - name: Upload Runnable App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProject-Windows-App
          # 빌드가 완료된 깨끗한 청정 실행형 패키지 파일을 수거합니다.
          path: target/*.jar

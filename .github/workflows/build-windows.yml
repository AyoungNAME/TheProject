name: Build Windows EXE Installer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: ./mvnw clean javafx:jlink

      - name: Build Windows EXE Installer via jpackage
        # 🛠️ [최종 버그 수정] 파일 이름(demo1-1.0-SNAPSHOT)을 직접 적는 대신, target 폴더 내부의 모든 jar를 자동으로 읽어오도록 지정합니다.
        run: |
          jpackage --type exe --name "TheProject" --input target --runtime-image target/app --main-class part.demo1.HelloApplication

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheProject-Windows-Installer
          path: ./*.exe
